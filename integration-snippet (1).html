<script>
// ---- 1. CONFIG: paste your deployed Apps Script Web App URL here ----
var SHORTLIST_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyjf-Rv0wIz4zVJRce5ahhK3Zdm-7CGnt5maEDn4osHxdaPuCQ37u0h5btz7ouhknKT/exec';

// Tracks which candidates are currently shortlisted (by email), so the
// UI can reflect state without re-fetching the sheet every time.
var shortlistedState = {};

/**
 * Sends a shortlist / un-shortlist action to the Apps Script Web App,
 * which writes it back into the Google Sheet.
 */
function setShortlisted(student, shortlisted) {
  if (!student.email) {
    console.warn('Cannot shortlist: candidate has no email on file.');
    return Promise.reject(new Error('Missing email'));
  }

  return fetch(SHORTLIST_WEBAPP_URL, {
    method: 'POST',
    // Apps Script Web Apps don't support custom Content-Type headers from
    // cross-origin requests without extra config, so 'text/plain' + manual
    // JSON.stringify is the reliable pattern here.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ email: student.email, shortlisted: shortlisted })
  })
  .then(function(res) { return res.json(); })
  .then(function(result) {
    if (!result.ok) throw new Error(result.error || 'Unknown error writing to sheet');
    shortlistedState[student.email] = shortlisted;
    return result;
  });
}
</script>
